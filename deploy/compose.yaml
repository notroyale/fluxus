name: fluxus
services:
  api:
    profiles: [app]
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    depends_on:
      db:
        condition: service_healthy
    environment:
      ConnectionStrings__Catalogue: Host=db;Port=5432;Database=fluxus;Username=fluxus;Password=${POSTGRES_PASSWORD:-local-development-only};SSL Mode=Disable;GSS Encryption Mode=Disable
      Source__Mode: ${SOURCE_MODE:-Live}
      Source__MaxAuctions: 100
      Source__ManualImportsEnabled: true
      Landscape__ArtifactRoot: /landscape-artifacts
      Landscape__PreviewRoot: /terrain-previews
    volumes:
      - landscape-artifacts:/landscape-artifacts:ro
      - ../.local/terrain-previews:/terrain-previews:ro
    ports:
      - "127.0.0.1:8080:8080"
  landscape-worker:
    profiles: [landscape]
    build:
      context: ..
      dockerfile: deploy/Landscape.Dockerfile
    depends_on:
      db:
        condition: service_healthy
    environment:
      ConnectionStrings__Catalogue: Host=db;Port=5432;Database=fluxus;Username=fluxus;Password=${POSTGRES_PASSWORD:-local-development-only};SSL Mode=Disable;GSS Encryption Mode=Disable
      Landscape__InputRoot: /inputs
      Landscape__ArtifactRoot: /landscape-artifacts
      Landscape__ProcessingEnabled: ${LANDSCAPE_PROCESSING_ENABLED:-true}
      Landscape__MaxArtifactBytes: ${LANDSCAPE_MAX_ARTIFACT_BYTES:-10737418240}
    volumes:
      - ../.local/landscape-inputs:/inputs:ro
      - landscape-artifacts:/landscape-artifacts
    read_only: true
    tmpfs:
      - /tmp:size=64m
    mem_limit: 4g
    cpus: 2
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
  db:
    image: postgis/postgis:17-3.5
    environment:
      POSTGRES_DB: fluxus
      POSTGRES_USER: fluxus
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local-development-only}
    ports:
      - "127.0.0.1:15432:5432"
    volumes:
      - postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fluxus -d fluxus"]
      interval: 5s
      timeout: 5s
      retries: 12
  landscape-preparation:
    profiles: [landscape-preparation]
    build:
      context: ..
      dockerfile: deploy/LandscapePreparation.Dockerfile
    environment:
      Landscape__InputRoot: /inputs
      Landscape__PreparationRoot: /outputs
      ConnectionStrings__Catalogue: Host=db;Port=5432;Database=fluxus;Username=fluxus;Password=${POSTGRES_PASSWORD:-local-development-only};SSL Mode=Disable;GSS Encryption Mode=Disable
    volumes:
      - ../.local/landscape-inputs:/inputs:ro
      - ../.local/landscape-prepared:/outputs
    read_only: true
    tmpfs: [/tmp:size=128m]
    mem_limit: 4g
    cpus: 2
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
volumes:
  postgres:
  landscape-artifacts:
